name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # 네트워크·API 키 없이 돈다. DART 호출은 테스트에서 막혀 있다.
      - run: python -m unittest discover -s tests -t . -v
        env:
          DART_OFFLINE: "1"
